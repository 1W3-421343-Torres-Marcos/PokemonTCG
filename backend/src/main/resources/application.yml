spring:
  application:
    name: pokemontcg-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pokemontcg}
    username: ${DB_USER:pokemon}
    password: ${DB_PASSWORD:pokemon}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

server:
  port: 8080

pokemontcg:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  tcgdex:
    base-url: https://api.tcgdex.net/v2
  catalog:
    startup-sync: ${CATALOG_STARTUP_SYNC:false}
    default-set-id: base1
    default-lang: en
