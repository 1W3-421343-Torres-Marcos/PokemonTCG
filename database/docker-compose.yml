services:
  postgres:
    image: postgres:16-alpine
    container_name: pokemontcg-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pokemontcg
      POSTGRES_USER: pokemon
      POSTGRES_PASSWORD: pokemon
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokemon -d pokemontcg"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
